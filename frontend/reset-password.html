<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password — ATS Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=2">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-container" style="background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex;">
        <div class="auth-card" style="position: relative;">
            <h2>Reset Password</h2>
            <p id="authSubtitle">Enter your new password below.</p>

            <div id="formSection">
                <!-- New Password -->
                <div style="position: relative; width: 100%;">
                    <input type="password" id="newPassword" class="auth-input" placeholder="New Password"
                        style="padding-right: 45px !important; width: 100%; box-sizing: border-box;">
                    <button type="button" onclick="toggleVisibility('newPassword', 'eyeIcon1')"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: #a1a1aa; padding: 0; display: flex; align-items: center; z-index: 10;">
                        <svg id="eyeIcon1" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <!-- Confirm Password -->
                <div style="position: relative; width: 100%; margin-top: 12px;">
                    <input type="password" id="confirmPassword" class="auth-input" placeholder="Confirm New Password"
                        style="padding-right: 45px !important; width: 100%; box-sizing: border-box;">
                    <button type="button" onclick="toggleVisibility('confirmPassword', 'eyeIcon2')"
                        style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: #a1a1aa; padding: 0; display: flex; align-items: center; z-index: 10;">
                        <svg id="eyeIcon2" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </button>
                </div>

                <button onclick="resetPassword()" class="primary-btn"
                    style="width: 100%; margin-top: 16px; justify-content: center;">
                    Reset Password
                </button>
            </div>

            <div id="message" style="margin-top: 16px; font-size: 0.9rem; text-align: center;"></div>

            <p style="text-align: center; margin-top: 16px; font-size: 0.85rem; color: var(--text-muted);">
                <a href="/" style="color: var(--text-muted);">← Back to Sign In</a>
            </p>
        </div>
    </div>

    <script>
        const API_BASE = "http://127.0.0.1:8000/api";

        // Token URL se nikalo
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        if (!token) {
            document.getElementById('authSubtitle').innerText = "Invalid or missing reset link.";
            document.getElementById('formSection').style.display = 'none';
        }

        async function resetPassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const msgEl = document.getElementById('message');

            if (!newPassword || !confirmPassword) {
                msgEl.style.color = 'var(--danger)';
                msgEl.innerText = "Please fill in both fields.";
                return;
            }

            if (newPassword !== confirmPassword) {
                msgEl.style.color = 'var(--danger)';
                msgEl.innerText = "Passwords do not match!";
                return;
            }

            msgEl.style.color = 'var(--text-muted)';
            msgEl.innerText = "Resetting...";

            try {
                const res = await fetch(`${API_BASE}/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: newPassword })
                });
                const data = await res.json();

                if (!res.ok) {
                    msgEl.style.color = 'var(--danger)';
                    msgEl.innerText = data.detail || "Reset failed.";
                    return;
                }

                msgEl.style.color = 'var(--success)';
                msgEl.innerText = "✅ Password reset successful! Redirecting to login...";
                document.getElementById('formSection').style.display = 'none';

                setTimeout(() => window.location.href = '/', 2000);

            } catch (err) {
                msgEl.style.color = 'var(--danger)';
                msgEl.innerText = "Something went wrong. Try again.";
            }
        }

        function toggleVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                `;
            } else {
                input.type = 'password';
                icon.innerHTML = `
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                `;
            }
        }
    </script>
</body>

</html>
